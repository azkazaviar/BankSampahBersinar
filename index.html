<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Bank Sampah Bersinar</title>
    <style>
        /* Custom styles for the slider */
        .slider {
            display: flex;
            overflow: hidden;
            position: relative;
            height: 250px;
        }

        .slide {
            flex-shrink: 0;
            width: 100%;
            transition: transform 0.5s ease-in-out;
        }
    </style>
</head>

<body class="bg-gray-100">

    <!-- Navbar -->
    <header class="bg-white shadow-md">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <img src="assets/images/logo.png" alt="Logo" class="h-10">
            <h1 class="text-lg font-bold text-green-700">Your waste management partner</h1>
            <button class="text-gray-700 focus:outline-none">
                <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
        </div>
    </header>

    <!-- Banner Slider -->
    <section class="container mx-auto mt-4 px-4">
        <div class="slider relative">
            <div class="slide">
                <img src="assets/images/banner.jpg" alt="Banner 1"
                    class="w-full h-full object-cover rounded-lg shadow-md">
            </div>
            <div class="slide">
                <img src="assets/images/banner2.png" alt="Banner 2"
                    class="w-full h-full object-cover rounded-lg shadow-md">
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <section class="container mx-auto mt-6 px-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

            <!-- Registration Card -->
            <div class="bg-green-200 rounded-lg p-4 shadow-lg flex flex-col items-center">
                <div class="text-center">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="h-16 w-16 text-green-700 mx-auto mb-3">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M18 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0ZM3 19.235v-.11a6.375 6.375 0 0 1 12.75 0v.109A12.318 12.318 0 0 1 9.374 21c-2.331 0-4.512-.645-6.374-1.766Z" />
                    </svg>
                    <h2 class="text-lg font-bold text-green-700 mb-2">Registrasi</h2>
                    <p class="text-sm text-green-800">Silahkan registrasi untuk menjadi bagian dari nasabah Bank Sampah
                        Bersinar.</p>
                </div>
                <a href="register.html"
                    class="mt-4 bg-green-700 text-white py-2 px-4 rounded-lg shadow-lg hover:bg-green-600">Daftar</a>
            </div>

            <!-- Login Card -->
            <div class="bg-green-200 rounded-lg p-4 shadow-lg flex flex-col items-center">
                <div class="text-center">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="h-16 w-16 text-green-700 mx-auto mb-3">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M8.25 9V5.25A2.25 2.25 0 0 1 10.5 3h6a2.25 2.25 0 0 1 2.25 2.25v13.5A2.25 2.25 0 0 1 16.5 21h-6a2.25 2.25 0 0 1-2.25-2.25V15M12 9l3 3m0 0-3 3m3-3H2.25" />
                    </svg>

                    <h2 class="text-lg font-bold text-green-700 mb-2">Log In</h2>
                    <p class="text-sm text-green-800">Silahkan masuk akun jika sudah menjadi bagian dari nasabah Bank
                        Sampah Bersinar.</p>
                </div>
                <a href="login.html"
                    class="mt-4 bg-green-700 text-white py-2 px-4 rounded-lg shadow-lg hover:bg-green-600">Masuk</a>
            </div>

        </div>

    </section>

    <!-- Floating Action Button -->


    <!-- Floating Action Button -->
    <a href="live-chat.html"
        class="fixed bottom-6 right-6 bg-green-700 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center hover:bg-green-600">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
            class="w-8 h-8">
            <path stroke-linecap="round" stroke-linejoin="round"
                d="M8.625 8.25h6.75m-6.75 3h4.5m-4.5 3h3m3.75 2.25H6a3 3 0 0 1-3-3v-9a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3l-3.75 3.75Z" />
        </svg>
    </a>

    <script>
        // Slider Functionality
        const slides = document.querySelectorAll('.slide');
        let currentIndex = 0;

        function showNextSlide() {
            slides.forEach((slide, index) => {
                slide.style.transform = `translateX(-${currentIndex * 100}%)`;
            });
            currentIndex = (currentIndex + 1) % slides.length; // Loop back to the first slide
        }

        setInterval(showNextSlide, 2000); // Change slide every 3 seconds
    </script>

</body>

</html>
