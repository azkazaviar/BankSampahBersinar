<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Dashboard</title>
</head>

<body class="bg-gray-100">

    <!-- Header -->
    <header class="bg-orange-200 px-6 py-4 flex items-center justify-between">
        <div>
            <p class="text-sm text-gray-700">Selamat datang,</p>
            <h1 class="text-2xl font-bold text-gray-900">Tasya</h1>
        </div>
        <div class="flex items-center gap-2">
            <button class="bg-green-200 p-2 rounded-full">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="size-6 text-green-700">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                </svg>

            </button>
            <a href="index.html" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-green-700">
                Keluar
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="px-6 py-6">
        <!-- Welcome Section -->
        <section class="bg-white p-6 rounded-lg shadow-lg mb-6 flex justify-between items-center   ">
            <div>
                <h2 class="text-lg md:text-3xl font-bold text-gray-900">Tukarkan Sampahmu Sekarang!</h2>
                <p class="text-md md:text-xl text-gray-700">Pilah sampahmu sesuai jenisnya, lalu pesan penjemputan
                    sampah atau
                    datang
                    ke Cabang Bank Sampah Bersinar terdekat!</p>
            </div>

            <img src="assets/images/logo-dashboard.jpg" alt="Bank Sampah Bersinar" class="h-36 mx-auto mt-4">
        </section>

        <!-- Menu Section -->
        <section>
            <h2 class="text-lg font-bold text-gray-900 mb-4">Menu</h2>
            <div class="grid grid-cols-2 gap-4">
                <!-- Pengaturan Akun -->
                <a href="dashboard-pengaturan-akun.html"
                    class="flex flex-col items-center bg-white p-4 rounded-lg shadow-lg hover:bg-gray-100">
                    <div class="bg-green-200 p-4 rounded-full">
                        <!-- Heroicon: User -->
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="size-8 text-green-700">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                        </svg>
                    </div>
                    <span class="mt-2 text-sm font-medium text-gray-900">Pengaturan Akun</span>
                </a>

                <!-- Penjemputan Sampah -->
                <a href="dashboard-penjemputan-sampah.html"
                    class="flex flex-col items-center bg-white p-4 rounded-lg shadow-lg hover:bg-gray-100">
                    <div class="bg-blue-200 p-4 rounded-full">
                        <!-- Heroicon: Truck -->

                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="size-8 text-blue-700">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                        </svg>

                    </div>
                    <span class="mt-2 text-sm font-medium text-gray-900">Penjemputan Sampah</span>
                </a>

                <!-- Riwayat Penjemputan -->
                <a href="dashboard-riwayat.html"
                    class="flex flex-col items-center bg-white p-4 rounded-lg shadow-lg hover:bg-gray-100">
                    <div class="bg-yellow-200 p-4 rounded-full">
                        <!-- Heroicon: Clipboard List -->
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                            stroke="currentColor" class="size-8 text-yellow-700">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                        </svg>

                    </div>
                    <span class="mt-2 text-sm font-medium text-gray-900">Riwayat Penjemputan</span>
                </a>
            </div>
        </section>

    </main>

</body>

</html>
