<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Lupa Kata Sandi</title>
</head>

<body class="bg-gray-100 flex justify-center items-center min-h-screen">

    <!-- Forgot Password Form -->
    <div class="bg-green-200 rounded-lg shadow-lg w-full max-w-sm px-6 py-8">
        <div class="text-center mb-6">
            <img src="assets/images/logo.png" alt="Logo Bank Sampah" class="h-16 mx-auto mb-4">
            <h1 class="text-2xl font-bold text-green-800">Lupa Kata Sandi</h1>
        </div>

        <!-- Form Start -->
        <form action="#" method="POST">
            <!-- Username -->
            <div class="mb-4">
                <label for="password" class="block text-sm font-medium text-green-900">Kata Sandi Baru</label>
                <input type="text" id="password" name="password" placeholder="Masukkan Kata Sandi Baru"
                    class="mt-1 block w-full p-2 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500">
            </div>

            <!-- Konfirmasi Kata Sandi -->
            <div class="mb-4">
                <label for="password" class="block text-sm font-medium text-green-900">Konfirmasi Kata Sandi
                    Baru</label>
                <input type="text" id="password" name="password" placeholder="Masukkan Konfirmasi Kata Sandi Baru"
                    class="mt-1 block w-full p-2 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500">
            </div>




            <!-- Submit Button -->
            <a href="login.html" type="submit"
                class="w-full flex justify-center bg-black text-white py-2 px-4 rounded-lg hover:bg-gray-800">
                Submit
            </a>
        </form>
        <!-- Form End -->
    </div>

</body>

</html>
