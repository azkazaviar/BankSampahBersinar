<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Login</title>
</head>

<body class="bg-gray-100 flex justify-center items-center min-h-screen">

    <!-- Login Form -->
    <div class="bg-green-200 rounded-lg shadow-lg w-full max-w-sm px-6 py-8">
        <div class="text-center mb-6">
            <img src="assets/images/logo.png" alt="Logo Bank Sampah" class="h-16 mx-auto mb-4">
            <h1 class="text-2xl font-bold text-green-800">LOG IN</h1>
        </div>

        <!-- Form Start -->
        <form id="loginForm">
            <!-- Username -->
            <div class="mb-4">
                <label for="username" class="block text-sm font-medium text-green-900">Username</label>
                <input type="text" id="username" name="username" placeholder="Masukkan username"
                    class="mt-1 block w-full p-2 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500">
            </div>

            <!-- Password -->
            <div class="mb-4 relative">
                <label for="password" class="block text-sm font-medium text-green-900">Kata Sandi</label>
                <input type="password" id="password" name="password" placeholder="Masukkan password"
                    class="mt-1 block w-full p-2 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500">
                <button type="button" class="absolute right-3 top-9">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-600" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 12a3 3 0 11-6 0 3 3 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-.01.326-.042.648-.096.965M15 12a3 3 0 11-6 0 3 3 0 016 0zm5.174 4.417C18.942 19.382 15.605 21 12 21c-3.605 0-6.942-1.618-8.174-4.583M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-.01.326-.042.648-.096.965" />
                    </svg>
                </button>
            </div>

            <!-- Remember Me -->
            <div class="mb-6 flex items-center">
                <input type="checkbox" id="remember" name="remember"
                    class="h-4 w-4 text-green-600 focus:ring-green-500 border-gray-300 rounded">
                <label for="remember" class="ml-2 text-sm text-green-900">Ingat Saya</label>
            </div>

            <!-- Submit Button -->
            <a href="dashboard.html" type="button" id="submitButton"
                class="flex justify-center w-full bg-black text-white py-2 px-4 rounded-lg hover:bg-gray-800">
                Masuk
            </a>

            <!-- Forgot Password -->
            <a href="forgot-password.html" type="button"
                class="flex justify-center mt-3 w-full bg-red-600 text-white py-2 px-4 rounded-lg hover:bg-red-700">
                Lupa Kata Sandi?
            </a>
        </form>
        <!-- Form End -->
    </div>

    <!-- Modal -->
    <div id="verificationModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex justify-center items-center">
        <div class="bg-white rounded-lg shadow-lg w-full max-w-sm p-6">
            <h2 class="text-lg font-bold text-gray-800 mb-4 text-center">Kode Verifikasi</h2>
            <input type="text" placeholder="Masukkan kode verifikasi"
                class="block w-full p-2 border border-gray-300 rounded-lg focus:ring-green-500 focus:border-green-500 mb-4">
            <div class="flex justify-end gap-2">
                <button id="cancelButton" class="bg-gray-300 text-gray-700 py-2 px-4 rounded-lg hover:bg-gray-400">
                    Cancel
                </button>
                <button class="bg-green-600 text-white py-2 px-4 rounded-lg hover:bg-green-700">
                    OK
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        const modal = document.getElementById('verificationModal');
        const submitButton = document.getElementById('submitButton');
        const cancelButton = document.getElementById('cancelButton');

        // Show Modal
        submitButton.addEventListener('click', () => {
            modal.classList.remove('hidden');
        });

        // Hide Modal
        cancelButton.addEventListener('click', () => {
            modal.classList.add('hidden');
        });
    </script>

</body>

</html>
